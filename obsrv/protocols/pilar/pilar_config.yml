settings:
  connection_pool_size: 10
  id_pool_range: [101, 10000]
  timeouts:
    connection: 10.0
    get_command: 10.0
    set_command: 120.0
    pool_get: 5.0
  focuser:
    multiplier: 1000.0

components:
  focuser:
    mappings:
      connected: "POSITION.INSTRUMENTAL.FOCUS.POWER_STATE"
      position: "POINTING.SETUP.FOCUS.POSITION"
      tempcomp: "POINTING.SETUP.FOCUS.TEMPCOMP"
      ismoving: "POINTING.SETUP.FOCUS.ISMOVING"
      fansstatus: "AUXILIARY.FANS.STATUS"
      halt: "POINTING.SETUP.FOCUS.HALT"
      tracking: "POINITNG.TRACK"
    actions:
      fansturnon:
        - variable: "fansstatus"
          value: "ON"
      fansturnoff:
        - variable: "fansstatus"
          value: "OFF"
      move:
        - variable: "position"
          value: "{Position}"
        - variable: "tracking"
          value: 4

  telescope: # 'telescope' jest używane jako standardowa nazwa dla komponentu 'mount'
#    reading:
    mappings:
      #connected: "POSITION.INSTRUMENTAL.RA.POWER_STATE" #Polecenie dobre, ale wykrzacza się samo "conencted"
      rightascension: "POSITION.EQUATORIAL.RA_CURRENT"
      rightascension_move: "OBJECT.EQUATORIAL.RA"
      declination: "POSITION.EQUATORIAL.DEC_CURRENT"
      declination_move: "OBJECT.EQUATORIAL.DEC"
      azimuth: "POSITION.HORIZONTAL.AZ"
      azimuth_move: "OBJECT.INSTRUMENTAL.AZ"
      altitude: "POSITION.HORIZONTAL.ALT"
      altitude_move: "OBJECT.INSTRUMENTAL.ALT"
      athome: "TELESCOPE.READY_STATE"
      atpark: "TELESCOPE.READY_STATE"
      slewing: "TELESCOPE.MOTION_STATE"
      tracking: "POINTING.TRACK"
      motorstatus: "TELESCOPE.READY"
      abortslew: "TELESCOPE.STOP"
      park: "TELESCOPE.READY" #TO CHANGE
      motor: "CABINET.POWER" #TO CHANGE
#      errorstring: "SYSTEM.ERROR.STRING"
#      sideofpier: "POINTING.STATE.SIDEOFPIER"
    actions:
      slewtocoordinates:
        - variable: "epoch"
          value: 2000.0
        - variable: "equinox"
          value: 2000.0
        - variable: "rightascension_move"
          value: "{RightAscension}"
        - variable: "declination_move"
          value: "{Declination}"
        - tracking: "tracking"
          value: 2
        - verify:
            rightascension: "{RightAscension}"
            declination: "{Declination}"
            tolerance: 0.05
            timeout: 120
      slewtocoordinatesasync:
        - variable: "epoch"
          value: 2000.0
        - variable: "equinox"
          value: 2000.0
        - variable: "rightascension_move"
          value: "{RightAscension}"
        - variable: "declination_move"
          value: "{Declination}"
        - tracking: "tracking"
          value: 2
        - verify:
            rightascension: "{RightAscension}"
            declination: "{Declination}"
            tolerance: 0.05
            timeout: 120
      slewtoaltaz:
        - variable: "azimuth_move"
          value: "{Azimuth}"
        - variable: "altitude_move"
          value: "{Altitude}"
        - variable: "tracking"
          value: 2
        - verify:
            azimuth: "{Azimuth}"
            altitude: "{Altitude}"
            tolerance: 0.05
            timeout: 120
      slewtoaltazasync:
        - variable: "azimuth_move"
          value: "{Azimuth}"
        - variable: "altitude_move"
          value: "{Altitude}"
        - variable: "tracking"
          value: 2
        - verify:
            azimuth: "{Azimuth}"
            altitude: "{Altitude}"
            tolerance: 0.05
            timeout: 120
      tracking:
        - variable: "tracking"
          value: "{Tracking}"
      abortslew:
        - variable: "abortslew"
          value: 0
      park:
        - variable: "park"
          value: 0
      unpark:
        - variable: "park"
          value: 1
      findhome:
        - variable: "park"
          value: 1
      motoron:
        - variable: "motor"
          value: 1
      motoroff:
        - variable: "motor"
          value: 0

  rotator:
    reading:
      ismoving: "ROTATOR.STATE.ISMOVING"
      mechanicalposition: "ROTATOR.POSITION.MECHANICAL"
      position: "ROTATOR.POSITION.SKY"
      reverse: "ROTATOR.CONFIG.REVERSE"
      stepsize: "ROTATOR.CONFIG.STEPSIZE"
      targetposition: "ROTATOR.POSITION.TARGET"
      halt: "ROTATOR.COMMAND.HALT"
    actions:
      move:
        - variable: "position" # Ruch względny
          value: "REL:{Position}"
      moveabsolute:
        - variable: "position" # Ruch absolutny
          value: "{Position}"
      movemechanical:
        - variable: "mechanicalposition"
          value: "{Position}"
      sync:
        - variable: "position"
          value: "SYNC:{Position}"

  covercalibratior:
    mappings:
      coverstate: "AUXILIARY.COVER.REALPOS"
      covermove: "AUXILIARY.COVER.TARGETPOS"
#      calibratorstate:
#      brightness:
    actions:
      opencover:
        - variable: "covermove"
          value: "1"
      closecover:
        - variable: "covermove"
          value: "0"
#      calibratoron:
#        - variable: "brightness"
#          value: "{Brightness}"
#        - variable: "calibratorstate"
#          value: "ON"
#      calibratoroff:
#        - variable: "calibratorstate"
#          value: "OFF"

resource_locks:
  "POINTING.SETUP.FOCUS.POSITION": "FOCUSER_MOTOR"
  "POINTING.SETUP.FOCUS.HALT": "FOCUSER_MOTOR"
  "AUXILIARY.FANS.STATUS": "FANS_CONTROL"
  "AUXILIARY.COVER.STATE": "COVER_MOTOR"
  "AUXILIARY.CALIBRATOR.STATE": "CALIBRATOR_LAMP"
  "AUXILIARY.CALIBRATOR.BRIGHTNESS": "CALIBRATOR_LAMP"
  "OBJECT.EQUATORIAL.RA": "MOUNT_SLEW"
  "OBJECT.EQUATORIAL.DEC": "MOUNT_SLEW"
  "OBJECT.INSTRUMENTAL.AZ": "MOUNT_SLEW"
  "OBJECT.INSTRUMENTAL.ALT": "MOUNT_SLEW"
  "POINTING.TRACK": "MOUNT_STATE"
  "POINTING.STATE.ATPARK": "MOUNT_STATE"
  "POINTING.STATE.ATHOME": "MOUNT_STATE"
  "MOTORS.STATUS": "MOUNT_MOTORS"
  "ROTATOR.POSITION.SKY": "ROTATOR_MOTOR"
  "ROTATOR.POSITION.MECHANICAL": "ROTATOR_MOTOR"
  "ROTATOR.COMMAND.HALT": "ROTATOR_MOTOR"
